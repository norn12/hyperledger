version: '3.7'

# ZeroTrustBlock - Hyperledger Fabric Network Topology:
#   - 3 Raft ordering nodes (orderer1:7050, orderer2:8050, orderer3:9050 — 1 node fault tolerance)
#   - 4 Peer nodes (Hospital Org: peer0:7051, peer1:8051; Insurer Org: peer0:9051, peer1:10051)
#   - 2 CA nodes (ca.hospital:7054, ca.insurer:8054)

networks:
  zerotrust:
    name: zerotrust_network

volumes:
  orderer1.zerotrust.com:
  orderer2.zerotrust.com:
  orderer3.zerotrust.com:
  peer0.hospital.zerotrust.com:
  peer1.hospital.zerotrust.com:
  peer0.insurer.zerotrust.com:
  peer1.insurer.zerotrust.com:

services:

  # ============================================================
  # Certificate Authorities
  # ============================================================
  ca.hospital.zerotrust.com:
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.hospital.zerotrust.com
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.hospital.zerotrust.com-cert.pem
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server/priv_sk
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.hospital.zerotrust.com-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server/priv_sk
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./crypto-config/peerOrganizations/hospital.zerotrust.com/ca/:/etc/hyperledger/fabric-ca-server
    container_name: ca.hospital.zerotrust.com
    networks:
      - zerotrust

  ca.insurer.zerotrust.com:
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.insurer.zerotrust.com
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.insurer.zerotrust.com-cert.pem
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server/priv_sk
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.insurer.zerotrust.com-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server/priv_sk
      - FABRIC_CA_SERVER_PORT=8054
    ports:
      - "8054:8054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./crypto-config/peerOrganizations/insurer.zerotrust.com/ca/:/etc/hyperledger/fabric-ca-server
    container_name: ca.insurer.zerotrust.com
    networks:
      - zerotrust

  # ============================================================
  # Orderer Nodes (3-node RAFT consensus cluster — tolerates 1 node crash)
  # ============================================================
  orderer1.zerotrust.com:
    image: hyperledger/fabric-orderer:2.4
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_CHANNELPARTICIPATION_ENABLED=false
      - ORDERER_GENERAL_CLUSTER_SENDBUFFERSIZE=20
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/zerotrust.com/orderers/orderer1.zerotrust.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/zerotrust.com/orderers/orderer1.zerotrust.com/tls:/var/hyperledger/orderer/tls
      - ./configtx/genesis.block:/var/hyperledger/orderer/genesis.block
      - orderer1.zerotrust.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    container_name: orderer1.zerotrust.com
    networks:
      - zerotrust

  orderer2.zerotrust.com:
    image: hyperledger/fabric-orderer:2.4
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=8050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_CHANNELPARTICIPATION_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/zerotrust.com/orderers/orderer2.zerotrust.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/zerotrust.com/orderers/orderer2.zerotrust.com/tls:/var/hyperledger/orderer/tls
      - ./configtx/genesis.block:/var/hyperledger/orderer/genesis.block
      - orderer2.zerotrust.com:/var/hyperledger/production/orderer
    ports:
      - "8050:8050"
    container_name: orderer2.zerotrust.com
    networks:
      - zerotrust

  orderer3.zerotrust.com:
    image: hyperledger/fabric-orderer:2.4
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=9050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_CHANNELPARTICIPATION_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/zerotrust.com/orderers/orderer3.zerotrust.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/zerotrust.com/orderers/orderer3.zerotrust.com/tls:/var/hyperledger/orderer/tls
      - ./configtx/genesis.block:/var/hyperledger/orderer/genesis.block
      - orderer3.zerotrust.com:/var/hyperledger/production/orderer
    ports:
      - "9050:9050"
    container_name: orderer3.zerotrust.com
    networks:
      - zerotrust

  # ============================================================
  # Peer Nodes - Hospital Org
  # ============================================================
  peer0.hospital.zerotrust.com:
    image: hyperledger/fabric-peer:2.4
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=zerotrust_network
      - DOCKER_API_VERSION=1.40
      - DOCKER_BUILDKIT=0
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.hospital.zerotrust.com
      - CORE_PEER_ADDRESS=peer0.hospital.zerotrust.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospital.zerotrust.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.hospital.zerotrust.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospital.zerotrust.com:7051
      - CORE_PEER_LOCALMSPID=HospitalMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/hospital.zerotrust.com/peers/peer0.hospital.zerotrust.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/hospital.zerotrust.com/peers/peer0.hospital.zerotrust.com/tls:/etc/hyperledger/fabric/tls
      - peer0.hospital.zerotrust.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "7051:7051"
    container_name: peer0.hospital.zerotrust.com
    networks:
      - zerotrust

  peer1.hospital.zerotrust.com:
    image: hyperledger/fabric-peer:2.4
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=zerotrust_network
      - DOCKER_API_VERSION=1.40
      - DOCKER_BUILDKIT=0
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.hospital.zerotrust.com
      - CORE_PEER_ADDRESS=peer1.hospital.zerotrust.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer1.hospital.zerotrust.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospital.zerotrust.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.hospital.zerotrust.com:8051
      - CORE_PEER_LOCALMSPID=HospitalMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/hospital.zerotrust.com/peers/peer1.hospital.zerotrust.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/hospital.zerotrust.com/peers/peer1.hospital.zerotrust.com/tls:/etc/hyperledger/fabric/tls
      - peer1.hospital.zerotrust.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "8051:8051"
    container_name: peer1.hospital.zerotrust.com
    networks:
      - zerotrust

  # ============================================================
  # Peer Nodes - Insurer Org
  # ============================================================
  peer0.insurer.zerotrust.com:
    image: hyperledger/fabric-peer:2.4
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=zerotrust_network
      - DOCKER_API_VERSION=1.40
      - DOCKER_BUILDKIT=0
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.insurer.zerotrust.com
      - CORE_PEER_ADDRESS=peer0.insurer.zerotrust.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.insurer.zerotrust.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.insurer.zerotrust.com:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.insurer.zerotrust.com:9051
      - CORE_PEER_LOCALMSPID=InsurerMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/insurer.zerotrust.com/peers/peer0.insurer.zerotrust.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/insurer.zerotrust.com/peers/peer0.insurer.zerotrust.com/tls:/etc/hyperledger/fabric/tls
      - peer0.insurer.zerotrust.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "9051:9051"
    container_name: peer0.insurer.zerotrust.com
    networks:
      - zerotrust

  peer1.insurer.zerotrust.com:
    image: hyperledger/fabric-peer:2.4
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=zerotrust_network
      - DOCKER_API_VERSION=1.40
      - DOCKER_BUILDKIT=0
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.insurer.zerotrust.com
      - CORE_PEER_ADDRESS=peer1.insurer.zerotrust.com:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer1.insurer.zerotrust.com:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.insurer.zerotrust.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.insurer.zerotrust.com:10051
      - CORE_PEER_LOCALMSPID=InsurerMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/insurer.zerotrust.com/peers/peer1.insurer.zerotrust.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/insurer.zerotrust.com/peers/peer1.insurer.zerotrust.com/tls:/etc/hyperledger/fabric/tls
      - peer1.insurer.zerotrust.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "10051:10051"
    container_name: peer1.insurer.zerotrust.com
    networks:
      - zerotrust
